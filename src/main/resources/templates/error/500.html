<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Server Error - 500')}"></head>
<body class="bg-light">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="py-5 text-center">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4.5rem;"></i>
                        <h1 class="fw-bold mt-3 text-dark">500 - Server Error</h1>
                        <p class="text-muted mt-2 mb-4">
                            Something went wrong while processing your request. Please try again or return to the homepage.
                        </p>
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/}" class="btn btn-primary px-4">
                                <i class="bi bi-house-door me-1"></i> Return Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
