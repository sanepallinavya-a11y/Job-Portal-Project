<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Register - JobPortal')}"></head>
<body class="bg-light">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- ALERTS -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <span class="logo-icon bg-primary text-white p-2 rounded-3 fs-4 d-inline-block mb-2">
                                    <i class="bi bi-person-plus-fill"></i>
                                </span>
                                <h3 class="fw-bold mb-1">Create an Account</h3>
                                <p class="text-muted small">Join JobPortal as a Job Seeker or an Employer</p>
                            </div>

                            <form th:action="@{/register}" th:object="${user}" method="post" novalidate>
                                <!-- Full Name -->
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                               placeholder="John Doe" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" th:field="*{email}"
                                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                               placeholder="name@example.com" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <!-- Phone Number -->
                                <div class="mb-3">
                                    <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                               placeholder="10-digit mobile number (e.g. 9876543210)" maxlength="10" required>
                                    </div>
                                    <div class="form-text small">Must be exactly 10 digits without spaces or dashes.</div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>

                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="password" th:field="*{password}"
                                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                               placeholder="Enter password (at least 4 characters)" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <!-- Role Selection -->
                                <div class="mb-4">
                                    <label class="form-label d-block">Select Your Role <span class="text-danger">*</span></label>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="radio" class="btn-check" name="role" id="roleSeeker" value="JOB_SEEKER"
                                                   th:field="*{role}" checked>
                                            <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center" for="roleSeeker">
                                                <i class="bi bi-person-workspace fs-4 mb-1"></i>
                                                <span class="fw-semibold">Job Seeker</span>
                                                <small class="text-muted" style="font-size: 0.75rem;">I want to find a job</small>
                                            </label>
                                        </div>
                                        <div class="col-6">
                                            <input type="radio" class="btn-check" name="role" id="roleRecruiter" value="RECRUITER"
                                                   th:field="*{role}">
                                            <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center" for="roleRecruiter">
                                                <i class="bi bi-building fs-4 mb-1"></i>
                                                <span class="fw-semibold">Recruiter</span>
                                                <small class="text-muted" style="font-size: 0.75rem;">I want to hire talent</small>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                    <i class="bi bi-check2-circle me-1"></i> Create Account
                                </button>
                            </form>

                            <div class="text-center mt-4 pt-3 border-top">
                                <span class="text-muted small">Already have an account? </span>
                                <a th:href="@{/login}" class="text-primary fw-semibold small text-decoration-none">Sign in here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
