<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('My Profile - JobPortal')}"></head>
<body class="bg-light">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- ALERTS -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- BREADCRUMB / NAV -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h3 class="fw-bold mb-1">My Candidate Profile</h3>
                            <p class="text-muted small mb-0">Keep your professional credentials updated to impress recruiters</p>
                        </div>
                        <a th:href="@{/seeker/dashboard}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> Dashboard
                        </a>
                    </div>

                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{/seeker/profile}" th:object="${profileDto}" method="post">
                                <div class="row g-3">
                                    <!-- Full Name -->
                                    <div class="col-md-6">
                                        <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" required>
                                        </div>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                    </div>

                                    <!-- Email (read-only for security) -->
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Email Address (Registered)</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" class="form-control bg-light" id="email" th:field="*{email}" readonly>
                                        </div>
                                        <div class="form-text small">Email cannot be changed once registered.</div>
                                    </div>

                                    <!-- Phone Number -->
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                            <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                                   placeholder="10-digit phone" maxlength="10" required>
                                        </div>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                    </div>

                                    <!-- Education -->
                                    <div class="col-md-6">
                                        <label for="education" class="form-label">Education / Degree</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-mortarboard"></i></span>
                                            <input type="text" class="form-control" id="education" th:field="*{education}"
                                                   placeholder="e.g. B.Tech Computer Science, MS, B.Sc">
                                        </div>
                                    </div>

                                    <!-- Experience -->
                                    <div class="col-12">
                                        <label for="experience" class="form-label">Work Experience Summary</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                                            <input type="text" class="form-control" id="experience" th:field="*{experience}"
                                                   placeholder="e.g. 2 Years as Backend Java Developer at ABC Corp">
                                        </div>
                                    </div>

                                    <!-- Skills -->
                                    <div class="col-12">
                                        <label for="skills" class="form-label">Key Technical Skills & Competencies</label>
                                        <textarea class="form-control" id="skills" th:field="*{skills}" rows="3"
                                                  placeholder="Comma-separated list (e.g. Java, Spring Boot, MySQL, REST APIs, Git, Docker)"></textarea>
                                        <div class="form-text small">Separate multiple skills with commas so they render as badges.</div>
                                    </div>
                                </div>

                                <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                                    <a th:href="@{/seeker/dashboard}" class="btn btn-outline-secondary px-4">Cancel</a>
                                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                        <i class="bi bi-check2-circle me-1"></i> Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
