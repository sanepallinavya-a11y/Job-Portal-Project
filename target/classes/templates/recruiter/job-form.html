<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head(${isEdit} ? 'Edit Job Posting' : 'Post New Job')}"></head>
<body class="bg-light">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- ALERTS -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- HEADER -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h3 class="fw-bold mb-1" th:text="${isEdit} ? 'Edit Job Posting' : 'Post a New Job Opening'">Post New Job</h3>
                            <p class="text-muted small mb-0">Fill in the role details to publish to thousands of candidates</p>
                        </div>
                        <a th:href="@{/recruiter/jobs}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> Back to My Jobs
                        </a>
                    </div>

                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <form th:action="${isEdit} ? @{/recruiter/jobs/edit/{id}(id=${jobId})} : @{/recruiter/jobs/new}"
                                  th:object="${jobDto}" method="post">

                                <div class="row g-3">
                                    <!-- Job Title -->
                                    <div class="col-md-6">
                                        <label for="title" class="form-label">Job Title <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="title" th:field="*{title}"
                                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                               placeholder="e.g. Senior Java Backend Engineer" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                                    </div>

                                    <!-- Company Name -->
                                    <div class="col-md-6">
                                        <label for="companyName" class="form-label">Company Name <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="companyName" th:field="*{companyName}"
                                               th:classappend="${#fields.hasErrors('companyName')} ? 'is-invalid' : ''"
                                               placeholder="e.g. Acme Innovations Corp" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
                                    </div>

                                    <!-- Location -->
                                    <div class="col-md-6">
                                        <label for="location" class="form-label">Location <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="location" th:field="*{location}"
                                               th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''"
                                               placeholder="e.g. Bengaluru, India or Remote" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                                    </div>

                                    <!-- Experience Required -->
                                    <div class="col-md-6">
                                        <label for="experience" class="form-label">Experience Required <span class="text-danger">*</span></label>
                                        <select class="form-select" id="experience" th:field="*{experience}"
                                                th:classappend="${#fields.hasErrors('experience')} ? 'is-invalid' : ''" required>
                                            <option value="" disabled selected>-- Select Experience --</option>
                                            <option value="0-1 Years">0-1 Years (Entry Level / Freshers)</option>
                                            <option value="1-3 Years">1-3 Years (Junior / Mid)</option>
                                            <option value="3-5 Years">3-5 Years (Mid / Senior)</option>
                                            <option value="5+ Years">5+ Years (Lead / Principal)</option>
                                        </select>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}"></div>
                                    </div>

                                    <!-- Job Type -->
                                    <div class="col-md-4">
                                        <label for="jobType" class="form-label">Job Type <span class="text-danger">*</span></label>
                                        <select class="form-select" id="jobType" th:field="*{jobType}"
                                                th:classappend="${#fields.hasErrors('jobType')} ? 'is-invalid' : ''" required>
                                            <option value="" disabled selected>-- Select Type --</option>
                                            <option value="Full-time">Full-time</option>
                                            <option value="Part-time">Part-time</option>
                                            <option value="Remote">Remote</option>
                                            <option value="Contract">Contract</option>
                                            <option value="Internship">Internship</option>
                                        </select>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('jobType')}" th:errors="*{jobType}"></div>
                                    </div>

                                    <!-- Salary -->
                                    <div class="col-md-4">
                                        <label for="salary" class="form-label">Salary Range <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="salary" th:field="*{salary}"
                                               th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''"
                                               placeholder="e.g. ₹12,00,000 - ₹16,00,000 / yr" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                                    </div>

                                    <!-- Status (Default OPEN) -->
                                    <div class="col-md-4">
                                        <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                                        <select class="form-select" id="status" th:field="*{status}">
                                            <option value="OPEN">OPEN (Accepting Applications)</option>
                                            <option value="CLOSED">CLOSED (Archived / Inactive)</option>
                                        </select>
                                    </div>

                                    <!-- Skills -->
                                    <div class="col-12">
                                        <label for="skills" class="form-label">Required Skills (Comma separated) <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="skills" th:field="*{skills}"
                                               th:classappend="${#fields.hasErrors('skills')} ? 'is-invalid' : ''"
                                               placeholder="e.g. Java, Spring Boot, MySQL, REST APIs, Microservices" required>
                                        <div class="form-text small">Enter skills separated by commas to create badge tags.</div>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('skills')}" th:errors="*{skills}"></div>
                                    </div>

                                    <!-- Description -->
                                    <div class="col-12">
                                        <label for="description" class="form-label">Full Job Description <span class="text-danger">*</span></label>
                                        <textarea class="form-control" id="description" th:field="*{description}" rows="6"
                                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                                  placeholder="Describe company mission, key responsibilities, qualifications, and benefits..." required></textarea>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                    </div>
                                </div>

                                <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                                    <a th:href="@{/recruiter/jobs}" class="btn btn-outline-secondary px-4">Cancel</a>
                                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                        <i class="bi bi-check2-circle me-1"></i>
                                        <span th:text="${isEdit} ? 'Update Job' : 'Publish Job'">Publish Job</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
