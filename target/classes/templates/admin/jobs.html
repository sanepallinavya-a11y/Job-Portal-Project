<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Manage All Jobs - Admin')}"></head>
<body class="bg-light">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- ALERTS -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-1">Global Jobs Moderation</h3>
                    <p class="text-muted small mb-0">Total of <span class="fw-bold text-dark" th:text="${totalJobs}">0</span> jobs listed on the platform</p>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Admin Dashboard
                </a>
            </div>

            <!-- JOBS TABLE -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Job Title</th>
                                <th>Company</th>
                                <th>Recruiter</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Applicants</th>
                                <th>Posted Date</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="job, stat : ${jobs}">
                                <td class="text-muted" th:text="${stat.count}">1</td>
                                <td>
                                    <a th:href="@{/jobs/{id}(id=${job.id})}" class="fw-bold text-dark text-decoration-none" th:text="${job.title}">
                                        Job Title
                                    </a>
                                </td>
                                <td th:text="${job.companyName}">Company</td>
                                <td>
                                    <div class="small fw-semibold text-dark" th:text="${job.recruiter.fullName}">Recruiter</div>
                                    <div class="small text-muted" th:text="${job.recruiter.email}">email</div>
                                </td>
                                <td class="small text-muted" th:text="${job.location}">Bengaluru</td>
                                <td>
                                    <span class="badge" th:classappend="${job.isOpen()} ? 'badge-status-open' : 'badge-status-closed'" th:text="${job.status}">OPEN</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-primary border">
                                        <span th:text="${#lists.size(job.applications)}">0</span> Applicants
                                    </span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(job.postedDate, 'dd MMM yyyy')}">Date</td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-1">
                                        <!-- View -->
                                        <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-sm btn-outline-primary" title="View Job Details">
                                            <i class="bi bi-eye"></i>
                                        </a>

                                        <!-- Toggle Status -->
                                        <form th:action="@{/admin/jobs/toggle-status/{id}(id=${job.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${job.isOpen()} ? 'btn-outline-warning' : 'btn-outline-success'"
                                                    th:title="${job.isOpen()} ? 'Close Job' : 'Open Job'">
                                                <i class="bi" th:classappend="${job.isOpen()} ? 'bi-lock' : 'bi-unlock'"></i>
                                            </button>
                                        </form>

                                        <!-- Delete Job -->
                                        <form th:action="@{/admin/jobs/delete/{id}(id=${job.id})}" method="post" class="d-inline confirm-action"
                                              data-confirm-message="Are you sure you want to permanently delete this job listing?">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Job">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
