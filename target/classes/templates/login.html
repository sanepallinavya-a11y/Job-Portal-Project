<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Sign In - JobPortal')}"></head>
<body class="bg-light">

    <!-- NAVBAR -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- ALERTS -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <span class="logo-icon bg-primary text-white p-2 rounded-3 fs-4 d-inline-block mb-2">
                                    <i class="bi bi-box-arrow-in-right"></i>
                                </span>
                                <h3 class="fw-bold mb-1">Welcome Back</h3>
                                <p class="text-muted small">Sign in to access your portal</p>
                            </div>

                            <form th:action="@{/login}" th:object="${loginDto}" method="post">
                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" th:field="*{email}"
                                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                               placeholder="name@example.com" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <!-- Password -->
                                <div class="mb-4">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="password" th:field="*{password}"
                                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                               placeholder="Enter your password" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                                </button>
                            </form>

                            <!-- Demo Quick Credentials Box for Testing -->
                            <div class="demo-box mt-4">
                                <div class="fw-bold text-dark mb-2 small"><i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Accounts:</div>
                                <div class="d-flex flex-column gap-1">
                                    <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1" onclick="fillLogin('admin@jobportal.com', 'admin123')">
                                        <span class="badge bg-purple text-dark border me-1">Admin</span> admin@jobportal.com (admin123)
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1" onclick="fillLogin('recruiter@techcorp.com', 'recruiter123')">
                                        <span class="badge bg-success-subtle text-success border me-1">Recruiter</span> recruiter@techcorp.com (recruiter123)
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary text-start py-1" onclick="fillLogin('alex@example.com', 'seeker123')">
                                        <span class="badge bg-primary-subtle text-primary border me-1">Seeker</span> alex@example.com (seeker123)
                                    </button>
                                </div>
                            </div>

                            <div class="text-center mt-4 pt-3 border-top">
                                <span class="text-muted small">Don't have an account? </span>
                                <a th:href="@{/register}" class="text-primary fw-semibold small text-decoration-none">Register here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
